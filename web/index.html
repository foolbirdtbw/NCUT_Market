<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCUT Market · 北方工业大学校园二手交易平台</title>
  <link rel="stylesheet" href="css/site.css">
  <script>
    // 首次绘制前定好主题。始终写 data-theme，CSS 就只需要亮/暗两套令牌，不用再写媒体查询。
    try {
      document.documentElement.setAttribute("data-theme",
        localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  </script>
</head>

<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">NCUT Market</a>
      <nav class="site-nav" id="site-nav">
        <a href="#/products">商品</a>
        <a href="#/products/new">发布</a>
        <a href="#/mine">我的商品</a>
        <!-- 未读数由 messages.js 追加在这条里面。导航是静态的，所以徽标不怕被重绘冲掉。 -->
        <a href="#/messages" id="nav-messages">私信</a>
        <a href="#/announcements">公告</a>
        <a href="#/categories">分类</a>
        <a href="#/dormitory-areas">宿舍区</a>
      </nav>
      <div class="auth-slot" id="auth-slot"></div>
      <button type="button" class="button" id="theme-toggle">深色</button>
    </div>
  </header>

  <!-- 顶部公告条。放 header 外面，跟着页面滚走，不占着贴顶的那一条。
       内容由 announcements.js 填，空了 CSS 会让它整个不占高度。 -->
  <div class="announcement-bar" id="announcement-bar"></div>

  <main class="wrap" id="view"></main>

  <footer class="site-footer">
    <div class="wrap">NCUT Market ·
      <a href="/scalar" target="_blank" rel="noopener">接口文档</a></div>
  </footer>

  <script src="vendor/jquery-3.7.1.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/products.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/announcements.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
