<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCUT Market · 北方工业大学校园二手交易平台</title>
  <link rel="stylesheet" href="css/site.css">
  <script>
    // 首次绘制前定好主题。始终写 data-theme，CSS 就只需要亮/暗两套令牌，不用再写媒体查询。
    try {
      document.documentElement.setAttribute("data-theme",
        localStorage.getItem("theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "light");
    }
  </script>
</head>

<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/">NCUT Market</a>
      <nav class="site-nav" id="site-nav">
        <a href="#/products">商品</a>
        <!-- data-signin-only 是给 app.js 的 paintNavVisibility() 用的：未登录时整条不显示。
             只有发布带它——首页和商品列表里那两个发布入口也带着同一个属性。个人主页、私信、
             通知照常摆着，未登录点进去看到的是 NM.signInCard() 那张「请先登录」，不是空列表。 -->
        <a href="#/products/new" data-signin-only>发布</a>
        <!-- 标签跟着页面走，不跟着页面里的第一张卡走：#/mine 是三张卡的个人主页（我的商品 /
             我买到的 / 账号），拿其中一张卡的名字当整页的名字，喊的比看到的窄。 -->
        <a href="#/mine">个人主页</a>
        <!-- 未读数由 messages.js 追加在这条里面。导航是静态的，所以徽标不怕被重绘冲掉。 -->
        <a href="#/messages" id="nav-messages">私信</a>
        <!-- 同上，徽标由 notifications.js 追加。 -->
        <a href="#/notifications" id="nav-notifications">通知</a>
        <a href="#/announcements">公告</a>
        <!-- 这三条只有管理员看得到，由 app.js 的 paintNavVisibility() 按角色切。 -->
        <a href="#/categories" id="nav-categories">分类</a>
        <a href="#/dormitory-areas" id="nav-dormitory-areas">宿舍区</a>
        <a href="#/users" id="nav-users">用户</a>
      </nav>
      <div class="auth-slot" id="auth-slot"></div>
      <button type="button" class="button" id="theme-toggle">深色</button>
    </div>
  </header>

  <!-- 顶部公告条。放 header 外面，跟着页面滚走，不占着贴顶的那一条。
       内容由 announcements.js 填，空了 CSS 会让它整个不占高度。 -->
  <div class="announcement-bar" id="announcement-bar"></div>

  <main class="wrap" id="view"></main>

  <footer class="site-footer">
    <div class="wrap">
      <div>NCUT Market ·
        <a href="/scalar" target="_blank" rel="noopener">接口文档</a>
        <!-- 在线人数，由 app.js 拉一次填进来。没登录的游客算不进去——服务端没有会话，
             认不出两次匿名请求是不是同一个人，所以那行说明文字不是装饰。 -->
        <span class="online-count" id="online-count"></span>
        <span class="online-note">近 5 分钟有活动的登录用户</span></div>
      <!-- 仓库镜像，摆右边：左边那串文字和它挤在一起会连成一片。两个远程推同一份 master
           （见 README 那张表）。地址写死的，换地方要一起改。 -->
      <div class="footer-repos">
        <a href="https://github.com/foolbirdtbw/NCUT_Market" target="_blank" rel="noopener">
          <img class="repo-icon" src="img/github.webp" alt="GitHub"></a>
        <a href="https://gitee.com/tian_puwen/ncut_-market" target="_blank" rel="noopener">
          <img class="repo-icon" src="img/gitee.webp" alt="Gitee"></a>
      </div>
    </div>
  </footer>

  <script src="vendor/jquery-3.7.1.min.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/products.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/announcements.js"></script>
  <!-- 这两份要排在 app.js 前面：app.js 建路由表时就要用到 dictionaries 和 users。 -->
  <script src="js/dictionaries.js"></script>
  <script src="js/users.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
